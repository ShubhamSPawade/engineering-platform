name: Verify Superthread Pilot Scope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test scope boundaries without credentials
        run: node --test test/superthread-*.test.mjs
      - name: Verify only the registered pilot resources
        env:
          SUPERTHREAD_TEAM_ID: ${{ vars.SUPERTHREAD_TEAM_ID }}
          SUPERTHREAD_API_TOKEN: ${{ secrets.SUPERTHREAD_API_TOKEN }}
        run: node scripts/verify-superthread-scope.mjs
