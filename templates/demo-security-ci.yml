# Render PLATFORM_REPOSITORY and PLATFORM_SHA before installing this caller.
name: Demo CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-ci:
    uses: __PLATFORM_REPOSITORY__/.github/workflows/reusable-node-ci.yml@__PLATFORM_SHA__
    with:
      node-version-file: .nvmrc
      install-command: npm ci
      check-command: npm run check
      test-command: npm test
      build-command: npm run build
      smoke-command: node scripts/smoke.mjs dist/src/server.mjs
      container-build: true
  shared-security:
    uses: __PLATFORM_REPOSITORY__/.github/workflows/reusable-security.yml@__PLATFORM_SHA__
    with:
      policy-repository: __PLATFORM_REPOSITORY__
      policy-ref: __PLATFORM_SHA__
  verify:
    name: demo-verify
    needs: [shared-ci, shared-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CI_RESULT: ${{ needs.shared-ci.result }}
      SECURITY_RESULT: ${{ needs.shared-security.result }}
    steps:
      - name: Require successful CI and security
        shell: bash
        run: |
          if [ "$CI_RESULT" != success ] || [ "$SECURITY_RESULT" != success ]; then
            echo "Merge gate failed: CI=$CI_RESULT security=$SECURITY_RESULT"
            exit 1
          fi
